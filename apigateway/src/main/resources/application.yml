# yaml
server:
  port: 9091

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:9092
          predicates:
            - Path=/user-service/**


# Example alternative (if using service discovery like Eureka):
#      routes:
#        - id: userservice
#          uri: lb://userservice
#          predicates:
#            - Path=/users/**
#          filters:
#            - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include: "*"
