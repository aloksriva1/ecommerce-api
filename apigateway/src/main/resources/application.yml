server:
  port: 9091

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:9092/
          predicates:
            - Path=/api/v1/**
          filters:
            - RewritePath=/api/v1/(?<segment>.*), /user-service/api/v1/${segment}

#  main:
#    web-application-type: reactive

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
