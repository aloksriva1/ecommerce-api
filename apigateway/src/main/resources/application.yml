server:
  port: 9090

spring:
  application:
    name: api-gateway

#  cloud:
#    gateway:
#      routes:
#        - id: user-service
#          uri: http://localhost:9092/
#          predicates:
#            - Path=/api/v1/**
#          filters:
#            - RewritePath=/api/v1/(?<segment>.*), /user-service/api/v1/${segment}

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**
          filters:
            - RewritePath=/api/v1/users/(?<segment>.*), /api/v1/${segment}

        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - RewritePath=/api/v1/auth/(?<segment>.*), /api/v1/${segment}





eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

#  main:
#    web-application-type: reactive

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway